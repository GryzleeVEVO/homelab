- name: Allow user to shut down and suspend
  template:
    src: remote-shutdown.j2
    dest: /etc/sudoers.d/remote-shutdown
    mode: "0440"
  register: sudoers_file_install_out

- name: Check for correct sudo file
  command: visudo -c
  register: visudo_check_out
  changed_when: sudoers_file_install_out.changed and visudo_check_out.rc == 0
  failed_when: visudo_check_out.rc != 0
