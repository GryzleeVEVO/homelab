---
- name: Install prerequisites
  ansible.builtin.apt:
    package: ethtool
    state: present

- name: Allow user to shutdown and suspend
  ansible.builtin.template:
    src: remote-shutdown.j2
    dest: /etc/sudoers.d/remote-shutdown
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# Some NICs do not persist configuration between reboots
- name: Enable WoL on startup via a udev rule
  ansible.builtin.template:
    src: 80-wol.rules.j2
    dest: /etc/udev/rules.d/80-wol.rules
    owner: root
    group: root
    mode: "0644"

- name: Read current WoL setting
  ansible.builtin.command: "ethtool {{ wol_interface }}"
  register: wol_ethtool_out
  changed_when: false

- name: Enable WoL
  ansible.builtin.command: "ethtool -s {{ wol_interface }} wol g"
  when: "'Wake-on: g' not in wol_ethtool_out.stdout"
  changed_when: true

- name: Install alx-wol module
  ansible.builtin.import_tasks: alx-wol.yml
  when: wol_alx | default(false) | bool
