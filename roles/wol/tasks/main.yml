---
- name: Check prerequisites
  assert:
    that: wol_remote_user is defined

- name: Install prerequisites
  ansible.builtin.apt:
    package:
      - linux-headers-amd64
      - dkms
      - ethtool
      - git
      - wget
    state: present

- name: Clone AndiWeiss/alx-wol
  ansible.builtin.git:
    repo: https://github.com/AndiWeiss/alx-wol
    dest: /opt/alx-wol
    version: master

