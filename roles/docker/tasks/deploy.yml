---
- name: Create service directory
  ansible.builtin.file:
    path: "/opt/{{ service }}"
    state: directory
    mode: "0755"

- name: List templated files
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/docker/{{ service }}"
    patterns: "*.j2"
    recurse: true
  register: template_files

- name: List static files
  delegate_to: localhost
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/docker/{{ service }}"
    patterns: "*"
    excludes: "*.j2"
    recurse: true
  register: static_files

- name: Validate templates before continuing
  ansible.builtin.assert:
    that: lookup('template', item.path) is string
    fail_msg: "Template {{ item.path }} failed to render"
  loop: "{{ template_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost

- name: Create subdirectories for files
  ansible.builtin.file:
    path: "/opt/{{ service }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: >-
    {{
      (
        (static_files.files | map(attribute='path') | list) +
        (template_files.files | map(attribute='path') | list)
      )
      | map('relpath', playbook_dir + '/docker/' + service)
      | map('dirname')
      | select('ne', '')
      | unique
      | sort
      | list
    }}

- name: Copy static files
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/opt/{{ service }}/{{ item.path | relpath(playbook_dir + '/docker/' + service) }}"
    mode: "0644"
  loop: "{{ static_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Copy templates
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "/opt/{{ service }}/{{ (item.path | relpath(playbook_dir + '/docker/' + service)) | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  loop: "{{ template_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Start services
  community.docker.docker_compose_v2:
    project_src: "/opt/{{ service }}"
    pull: always
    state: present
    recreate: always
  when: docker_compose_recreate | default(false) | bool
