---
# noqa: var-naming[no-role-prefix]
- name: Render alloy config into variable
  ansible.builtin.set_fact:
    alloy_config: "{{ lookup('template', './templates/config.alloy.j2') }}"

- name: Install Alloy using official role
  ansible.builtin.import_role:
    name: grafana.grafana.alloy

- name: Tell firewalld to open port
  ansible.builtin.include_role:
    name: firewalld
    tasks_from: alloy
