---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    package: unattended-upgrades
    state: present
  notify: Enable and start unattended-upgrades

- name: Enable periodic upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
