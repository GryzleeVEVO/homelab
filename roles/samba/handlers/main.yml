- name: Enable and start smbd
  ansible.builtin.service:
    name: smbd
    state: started
    enabled: true

- name: Disable and stop nmbd
  ansible.builtin.service:
    name: nmbd
    state: started
    enabled: true

- name: Reload smbd
  ansible.builtin.service:
    name: smbd
    state: reloaded
