- name: Set up and run Docker containers
  hosts: all
  become: true
  pre_tasks:
    - name: Get render group ID
      ansible.builtin.getent:
        database: group
        key: render
      when: "'mediaserver' in docker_services"

    - name: Store render GID
      ansible.builtin.set_fact:
        render_group: "{{ ansible_facts.getent_group['render'][1] }}"

  tasks:
    - name: Deploy service
      ansible.builtin.include_role:
        name: docker
        tasks_from: deploy.yml
      loop: "{{ docker_services }}"
      loop_control:
        loop_var: service
