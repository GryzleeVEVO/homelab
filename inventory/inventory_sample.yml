all:
  hosts:
    foobar:
      hostname: foobar

      # Install this packages during postinstall
      base_packages:
        - curl
        - htop

      # "render" group, needed to access hardware acceleration
      render_group: 992

      # Versions of apps/images to pull
      version_tags:
        qbittorrent: 5.2.3-1

      #
      # --- SSH ---
      #

      # Disable password login
      sshd_no_passwd: false

      #
      # --- Wake-on-LAN ---
      #

      wol_remote_user: user
      wol_interface: eth0

      #
      # --- Wireshark ---
      #

      wireguard_server_ip: 10.0.0.1/24
      wireguard_server_public_endpoint: 192.168.10.1:51820
      wireguard_clients:
        - name: example_host
          ip: 10.0.0.2
          allowed_ips: 192.168.5.0/24

      #
      # --- Docker ---
      #

      # Deploy the following Docker Compose projects
      docker_services:
        - mediaserver
        - monitoring

      # CORS settings for Registry UI
      docker_registry_ui_env:
        REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "'[http://192.168.1.1:5001]'"

      #
      # --- Observability ---
      #

      # Endpoints for scraping Prometheus metrics
      prometheus_targets:
        prometheus:
          - 192.168.1.1:9090
        loki:
          - 192.168.1.1:3100
        node_exporter:
          - 192.168.1.1:9100

      # Enable management page
      alloy_env_file_vars:
        CUSTOM_ARGS: --server.http.listen-addr=0:0:0:0:12345

      # Loki endpoint
      alloy_loki_endpoint: http://192.168.1.66:3100/loki/api/v1/push

      # Services to monitor
      alloy_monitor_services:
        docker:
        journal:

      # Grafana instance
      grafana_env:
        GF_SERVER_DOMAIN: 192.168.1.1
        GF_SMTP_ENABLED: true
        GF_SMTP_HOST: '"smtp.gmail.com:25"'
        GF_SMTP_USER: foobar@example.com
        GF_SMTP_PASSWORD: verysecurepassword
